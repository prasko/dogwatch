# Shared role descriptions and default model tiers. Role behavior lives in roles/*.md.
# Tiers (fast, standard, deep, special) map to concrete models in codex/roles.toml and
# claude/roles.toml.

[assistant]
description = "Manage task worktrees and interactive Leads from the primary checkout; carry user decisions into handoffs and coordinate task workspace cleanup. Leave task scoping and delivery to Lead."
tier = "standard"

[lead]
description = "Own a task lifecycle: choose and adapt the workflow, scope and plan or delegate, retain decisions and track evidence."
tier = "deep"

[scoper]
description = "Own scope investigation or requirements discussion; return findings or a brief and unresolved decisions. May write scope docs; cannot edit production code or tests."
tier = "deep"

[architect]
description = "Own design and its review. May write design docs and edit source for an agreed design-stage sketch. Return decisions, artifacts and approval state. Leave implementation and tests to their owners."
tier = "deep"

[developer]
description = "Own implementation within the agreed plan; may edit production code and assigned tests and fixtures. Return changes, check results, design drift and review state."
tier = "standard"

[tester]
description = "Own separately assigned unit and integration testing; may edit tests and test fixtures, not production code. Return coverage, results and gaps; route production defects to the implementation owner."
tier = "standard"

[validator]
description = "Own acceptance validation; may create disposable resources and validation fixtures, not fix production code. Return a dated evidence report and cleanup status; route defects to the implementation owner."
tier = "standard"

[reviewer]
description = "Independently assess the assigned artifact in a separate context; return findings with severity, evidence and limitations. Cannot edit artifacts, fix code or write tests; review does not grant user approval."
tier = "standard"
